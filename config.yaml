# ─────────────────────────────────────────────
# 카드뉴스 자동화 설정
# ─────────────────────────────────────────────

brand:
  name: "세계 화제 한 장"        # 카드 왼쪽 위에 들어가는 계정 이름
  handle: "@your_account"        # 카드 하단에 들어가는 계정 핸들
  accent: "#FF4D4F"              # 포인트 색상

# true  = 텔레그램으로 미리보기를 보내고, 버튼을 눌러야 게시
# false = 완전 자동 게시 (단, 민감한 뉴스로 판단되면 승인 요청으로 돌림)
approval: true

platforms: [instagram, threads]

threads:
  include_link: false    # 기사 링크 넣기. 새 계정은 첫 1주 동안 끄고, 이후 켜서 반응을 비교
  with_image: true       # false 면 카드 이미지 없이 글만 게시

# Claude 를 부르는 방식
#   claude-code = Claude Pro/Max 구독 토큰으로 실행 (추가 비용 없음, 구독 사용량을 씀)
#   api         = Claude API 키로 실행 (사용량만큼 과금)
llm: claude-code
cli_model: ""          # claude-code 방식의 모델. 비워두면 구독 기본 모델 (예: sonnet, opus)
model: claude-opus-5-5 # api 방식의 모델
effort: medium

# 수집할 외신 RSS (여러 매체가 동시에 다루는 뉴스 = 터진 뉴스로 판단)
feeds:
  - { name: BBC,        url: "https://feeds.bbci.co.uk/news/world/rss.xml" }
  - { name: Guardian,   url: "https://www.theguardian.com/world/rss" }
  - { name: Al Jazeera, url: "https://www.aljazeera.com/xml/rss/all.xml" }
  - { name: NPR,        url: "https://feeds.npr.org/1004/rss.xml" }
  - { name: DW,         url: "https://rss.dw.com/rdf/rss-en-world" }
  - { name: CBS News,   url: "https://www.cbsnews.com/latest/rss/world" }
  - { name: Sky News,   url: "https://feeds.skynews.com/feeds/rss/world.xml" }

# 최근 몇 시간 안의 기사만 볼지
max_age_hours: 30

# Reddit 추천수도 화제도 판단에 쓰기 (REDDIT_CLIENT_ID/SECRET가 있을 때만 동작)
reddit:
  subreddits: [worldnews]
  limit: 25

image:
  commons: true          # Wikimedia Commons 무료 라이선스 사진 우선
  ai_fallback: true      # 맞는 사진이 없으면 AI 생성 (OPENAI_API_KEY 필요)
  ai_model: gpt-image-1
  min_width: 900

# 승인 대기 중인 카드가 이 시간이 지나면 자동 폐기
pending_expire_hours: 24

# 인스타그램이 이미지를 가져갈 공개 URL 기준 주소.
# 비워두면 GitHub 공개 저장소의 raw URL을 자동으로 사용
public_base_url: ""

ig_api_version: v23.0
